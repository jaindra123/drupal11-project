name: Drupal 11 CI/CD

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------
      # Checkout repository
      # -----------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Setup PHP 8.3 and Composer 2
      # -----------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2
          extensions: intl, gd, pdo_mysql, zip, opcache
          coverage: none

      # -----------------------------------------------
      # Validate composer.json / composer.lock
      # -----------------------------------------------
      - name: Validate composer files
        run: composer validate --no-check-publish

      # -----------------------------------------------
      # Install dependencies
      # -----------------------------------------------
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # -----------------------------------------------
      # Check PHP syntax for custom code
      # -----------------------------------------------
      - name: Lint custom PHP code
        run: |
          find web/modules/custom -type f -name "*.php" -exec php -l {} \;

      # -----------------------------------------------
      # (Optional) Run PHPUnit tests if you have them
      # -----------------------------------------------
      - name: Run PHPUnit tests (if phpunit.xml exists)
        run: |
          if [ -f phpunit.xml ]; then
            ./vendor/bin/phpunit --configuration phpunit.xml
          else
            echo "No phpunit.xml found, skipping tests."
          fi

      # -----------------------------------------------
      # (Optional) Cache Composer dependencies for speed
      # -----------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
